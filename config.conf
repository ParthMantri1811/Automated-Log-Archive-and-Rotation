########################################################
#  Automated Log Archive & Rotation — Configuration   #
########################################################
#
#  Edit the values below to customise the log rotator.
#  Lines beginning with '#' are comments and are ignored.
#  Blank lines are ignored.
#
#  After editing, run:
#      bash log_rotator.sh --config config.conf
#
########################################################

# ─── Directory Settings ──────────────────────────────

# Directory containing the log files to scan
LOG_DIR="./sample_logs"

# Directory where compressed archives will be stored
ARCHIVE_DIR="./archives"

# Path to the audit log file (records every action)
AUDIT_LOG="./audit.log"

# ─── Archiving Thresholds ────────────────────────────

# Archive log files older than this many days
MAX_AGE_DAYS=7

# Archive log files larger than this many kilobytes
MAX_SIZE_KB=1024

# ─── Retention Policy ────────────────────────────────

# Delete archives older than this many days
RETENTION_DAYS=30

# ─── Compression ─────────────────────────────────────

# Compression tool to use: gzip | bzip2 | xz
COMPRESSION="gzip"

# ─── File Selection ──────────────────────────────────

# Space-separated glob patterns for files to consider
LOG_EXTENSIONS="*.log *.txt *.out"

# ─── Behaviour ───────────────────────────────────────

# Set to true to preview actions without executing them
DRY_RUN=false

# Set to true for extra verbose output
VERBOSE=false
